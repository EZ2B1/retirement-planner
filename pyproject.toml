[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retirement-planner"
version = "0.1.0"
description = "Professional retirement planning calculation and workbook generator"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1", "pandas>=2.2", "numpy>=2.0", "PyYAML>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
retirement_planner = ["data/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
